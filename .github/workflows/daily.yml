name: Daily Claude Code Tips

on:
  schedule:
    - cron: '0 21 * * *'  # UTC 21:00 = JST 06:00
  workflow_dispatch:        # 手動実行用

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # seen_tips.json のコミット・プッシュに必要

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python bot.py

      - name: Commit and push seen_tips.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_tips.json
          git diff --staged --quiet || git commit -m "chore: update seen_tips cache [skip ci]"
          git push
